<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" stroke="none" role="img" aria-labelledby="title desc">
  <title id="title">Holodeck</title>
  <desc id="desc">An isometric process tank with a cyan liquid level and an amber pipe valve.</desc>
  <rect width="512" height="512" rx="96" fill="#0f1b2d"/>
  <!-- Equal isometric faces, with liquid occupying the lower half. -->
  <path d="M256 104 376 173 256 242 136 173Z" fill="#f4f4f4"/>
  <path d="M136 173 256 242V398L136 329Z" fill="#f4f4f4" fill-opacity="0.8"/>
  <path d="M256 242 376 173V329L256 398Z" fill="#f4f4f4" fill-opacity="0.5"/>
  <path d="M136 251 256 320V398L136 329Z" fill="#18bae6"/>
  <path d="M256 320 376 251V329L256 398Z" fill="#18bae6" fill-opacity="0.7"/>
  <!-- A large roof hatch and one outlet keep the silhouette readable at 40px. -->
  <path d="M256 141 312 173 256 205 200 173Z" fill="#0f1b2d"/>
  <path d="M376 291 416 314V354" fill="none" stroke="#18bae6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="305" r="16" fill="#f5a524"/>
</svg>
