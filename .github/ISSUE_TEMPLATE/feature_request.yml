name: Feature request
description: Describe a problem and the behaviour that would solve it.
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues and milestones first. Use Discussions for open-ended design questions.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Choose the closest area; maintainers apply the matching label during triage.
      options:
        - "area:runtime"
        - "area:compiler"
        - "area:wasm"
        - "area:ui"
        - "area:holodeck"
        - "area:sdk"
        - "area:ci"
        - "area:docs"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who needs this, and what cannot they do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Give a concrete example of the desired result.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing features or workarounds you tried.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How would we verify this solves the problem?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Milestone and related work
      description: Link related issues and note whether this belongs to M1, M2 or the post-M1 native runtime track.
